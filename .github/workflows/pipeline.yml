name: Pipeline

# Monthly data build (spec FR-01 to FR-05). Public data only.
# fetch -> build area shards in parallel -> merge -> release checks -> GitHub Release data-YYYY-MM.
# Nothing is published unless every check passes (AC-14); a failure opens an alert issue.
on:
  schedule:
    - cron: '0 3 2 * *' # 03:00 UTC on the 2nd of each month
  workflow_dispatch:
    inputs:
      areas:
        description: 'Area codes, space-separated (empty = all; private repo = reference areas)'
        required: false
        default: ''
      release:
        description: 'Release name YYYY-MM (empty = current month)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  # While the repository is private, Actions storage is limited (500 MB), so scheduled runs
  # build only the reference areas. Once public, an empty value builds all of Great Britain.
  REFERENCE_AREAS: 'E06000050 W11000023'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      partial: ${{ steps.shards.outputs.partial }}
      release: ${{ steps.release.outputs.release }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - id: release
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          release="${INPUT_RELEASE:-$(date -u +%Y-%m)}"
          [[ "$release" =~ ^[0-9]{4}-[0-9]{2}$ ]] || { echo "bad release name"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Fetch public data
        run: uv run within-reach-pipeline fetch --cache .cache
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ github.run_id }}
      - id: shards
        env:
          INPUT_AREAS: ${{ inputs.areas }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Scheduled events carry no repository object, so ask the API whether we're private.
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          areas="$INPUT_AREAS"
          if [ -z "$areas" ] && [ "$private" = "true" ]; then areas="$REFERENCE_AREAS"; fi
          echo "partial=$([ -n "$areas" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -n "$areas" ]; then
            # shellcheck disable=SC2086
            shards=$(uv run within-reach-pipeline areas --cache .cache --only $areas)
          else
            shards=$(uv run within-reach-pipeline areas --cache .cache --shard-size 10)
          fi
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "$shards"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # Let every shard finish, so one run shows all failing areas. Nothing publishes unless
      # every shard succeeds, because assemble needs the whole build job.
      fail-fast: false
      max-parallel: 8
      matrix:
        areas: ${{ fromJSON(needs.prepare.outputs.shards) }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool
      - name: Pull the map builder (pinned by digest in config.toml)
        run: |
          image=$(python3 -c "import tomllib; print(tomllib.load(open('config.toml', 'rb'))['maps']['tilemaker_image'])")
          docker pull "$image"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Build areas
        env:
          AREAS: ${{ matrix.areas }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          # shellcheck disable=SC2086
          uv run within-reach-pipeline build --cache .cache --release "$RELEASE" \
            --out shard --areas $AREAS --router osrm --maps tilemaker
      - id: name
        env:
          AREAS: ${{ matrix.areas }}
        run: echo "name=shard-$(echo "$AREAS" | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: pipeline/shard/
          retention-days: 1

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the release and record it on the data-log branch
    env:
      RELEASE: ${{ needs.prepare.outputs.release }}
      PARTIAL: ${{ needs.prepare.outputs.partial }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: pipeline/shards
      - name: Merge shards
        run: |
          uv run within-reach-pipeline build --cache .cache --release "$RELEASE" \
            --out "release/$RELEASE" --areas
          # One artifact is unpacked straight into shards/, several into shards/<name>/,
          # so find shard folders by their manifest rather than by glob.
          mapfile -t shard_dirs < <(find shards -maxdepth 2 -name manifest.json -printf '%h\n' | sort)
          [ "${#shard_dirs[@]}" -gt 0 ] || { echo "no shards downloaded"; exit 1; }
          uv run within-reach-pipeline merge --out "release/$RELEASE" "${shard_dirs[@]}"
      - name: Previous release
        id: previous
        run: |
          # Full releases only (data-YYYY-MM), excluding the month being built.
          previous=$(gh release list --limit 50 --json tagName \
            --jq '[.[].tagName | select(test("^data-[0-9]{4}-[0-9]{2}$"))
                  | select(. != "data-'"$RELEASE"'")] | sort | last // ""')
          if [ -n "$previous" ]; then
            gh release download "$previous" --pattern 'data-*.tar.gz' --dir previous
            tar -xzf previous/*.tar.gz -C previous
            echo "dir=previous/${previous#data-}" >> "$GITHUB_OUTPUT"
          fi
      - name: Release checks (FR-04)
        env:
          PREVIOUS_DIR: ${{ steps.previous.outputs.dir }}
        run: |
          args=(--release-dir "release/$RELEASE")
          [ -n "$PREVIOUS_DIR" ] && args+=(--previous-dir "$PREVIOUS_DIR")
          [ -f reference/expectations.toml ] && args+=(--reference reference/expectations.toml)
          [ "$PARTIAL" = "true" ] && args+=(--allow-partial)
          uv run within-reach-pipeline check "${args[@]}"
      - name: Publish release
        # Only main publishes. Partial runs get a -partial prerelease tag, which deploy never serves.
        if: github.ref == 'refs/heads/main'
        run: |
          tag="data-$RELEASE"; extra=()
          if [ "$PARTIAL" = "true" ]; then tag="data-$RELEASE-partial"; extra=(--prerelease); fi
          maps="maps-${tag#data-}"
          # Data and maps are separate assets, so neither nears GitHub's 2 GB asset limit and
          # deploy can serve maps for the latest release only.
          tar -czf "$tag.tar.gz" --exclude='map.pmtiles*' -C release "$RELEASE"
          (cd release && find "$RELEASE" -name 'map.pmtiles*' -print0 | sort -z \
            | tar -czf "../$maps.tar.gz" --null -T -)
          sha256sum "$tag.tar.gz" > "$tag.tar.gz.sha256"
          sha256sum "$maps.tar.gz" > "$maps.tar.gz.sha256"
          gh release create "$tag" "$tag.tar.gz" "$tag.tar.gz.sha256" \
            "$maps.tar.gz" "$maps.tar.gz.sha256" "${extra[@]}" \
            --title "Data release $RELEASE$([ "$PARTIAL" = "true" ] && echo ' (partial)')" \
            --notes "Automated data release. See manifest.json inside for sources and checksums."
      - name: Record release (keeps the monthly schedule active)
        # Writes to the data-log branch through the API, because main is protected.
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: bash scripts/record_release.sh

  alert:
    needs: [prepare, build, assemble]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an alert issue (FR-04)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Data pipeline failed ($(date -u +%Y-%m-%d))" \
            --body "The monthly data pipeline failed. If the failure was before the 'Publish release' step, nothing was published and the previous release stays live; otherwise check the Releases page. Run: $RUN_URL"
