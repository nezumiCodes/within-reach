name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-guards:
    name: Secrets and client-data guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (whole history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
      - name: No real-looking client data (NFR-06)
        run: git ls-files -z | xargs -0 python3 scripts/check_client_data.py

  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - run: uv run mypy
      - run: uv run mypy --strict ../scripts
      - run: uv run pytest . ../scripts

  app:
    name: App (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check build has no inline scripts (CSP has no 'unsafe-inline')
        run: |
          node -e "
            const html = require('fs').readFileSync('dist/index.html', 'utf8');
            const inline = [...html.matchAll(/<script\b([^>]*)>/gi)].filter((m) => !/\bsrc=/.test(m[1]));
            if (inline.length || /\son[a-z]+=/i.test(html)) { console.error('Inline script found'); process.exit(1); }
          "
      - name: Install test browsers
        # GitHub's Ubuntu runners ship Microsoft Edge; installing it ourselves is the flaky part.
        # No per-attempt kill: stopping apt midway leaves its lock held and breaks the retries.
        timeout-minutes: 15
        run: |
          browsers=(chromium firefox webkit)
          if command -v microsoft-edge-stable > /dev/null; then
            echo "Using the runner's Edge: $(microsoft-edge-stable --version)"
          else
            browsers+=(msedge)
          fi
          for attempt in 1 2 3; do
            npx playwright install --with-deps "${browsers[@]}" && exit 0
            echo "Browser install attempt $attempt failed; retrying"; sleep 15
          done
          exit 1
      - name: Browser, privacy and accessibility tests
        run: npm run test:e2e
        env:
          PW_EDGE: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results/
          retention-days: 7
