name: Deploy

# Pushes to main deploy a preview (https://preview.<project>.pages.dev).
# Tags v* deploy to production (withinreach.vasnik.net). Spec section 13, plan S-5.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Turned on by setting the repository variable DEPLOY_ENABLED=true once the Cloudflare
    # Pages project and the two secrets exist (see docs/phase-0-setup.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish build checksums
        run: (cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS) && cat dist/SHA256SUMS
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.163.0'
          workingDirectory: app
          command: >-
            pages deploy dist --project-name=within-reach
            --branch=${{ startsWith(github.ref, 'refs/tags/v') && 'main' || 'preview' }}
            --commit-hash=${{ github.sha }}
