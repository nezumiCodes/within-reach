name: Deploy

# Pushes to main deploy a preview (https://preview.<project>.pages.dev).
# Tags v* deploy to production (withinreach.vasnik.net). Spec section 13, plan S-5.
# A successful monthly Pipeline run redeploys production (the latest v* tag) with the new data.
# Every deploy bundles the latest two data releases under /data/ (FR-05 rollback).
# Roll back data: run this workflow manually with data_release=data-YYYY-MM.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
  workflow_dispatch:
    inputs:
      data_release:
        description: 'Serve this data release as latest (e.g. data-2026-11); empty = newest'
        required: false
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  # One queue per trigger and ref, so a push to main can't displace a monthly production redeploy.
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Turned on by setting the repository variable DEPLOY_ENABLED=true once the Cloudflare
    # Pages project and the two secrets exist (see docs/phase-0-setup.md).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in this environment, which only main and v* tags can use.
    environment: cloudflare
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Choose what to deploy
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_run" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" = "refs/heads/main" ]; }; then
            # Highest version tag by semantic order (the tags API is neither sorted nor complete).
            tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[].ref | sub("^refs/tags/"; "")' | sort -V | tail -1)
          fi
          if [ -n "${tag:-}" ]; then
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"; echo "branch=main" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/tags/v* ]]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "branch=preview" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Add data releases (latest and previous)
        env:
          WANTED: ${{ inputs.data_release }}
        run: |
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
            --jq '[.[].tagName | select(test("^data-[0-9]{4}-[0-9]{2}$"))] | sort | reverse | .[]')
          if [ -n "$WANTED" ]; then
            [[ "$WANTED" =~ ^data-[0-9]{4}-[0-9]{2}$ ]] || { echo "bad data_release"; exit 1; }
            printf '%s\n' "${tags[@]}" | grep -qx "$WANTED" || { echo "no release $WANTED"; exit 1; }
            mapfile -t tags < <(printf '%s\n' "${tags[@]}" | awk -v w="$WANTED" '$0 <= w')
          fi
          if [ "${#tags[@]}" -eq 0 ]; then echo "No data release yet; deploying without data."; exit 0; fi
          mkdir -p app/dist/data
          for tag in "${tags[@]:0:2}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir /tmp/data \
              --pattern 'data-*.tar.gz' --pattern 'data-*.tar.gz.sha256'
            (cd /tmp/data && sha256sum -c "$tag.tar.gz.sha256")
            tar -xzf "/tmp/data/$tag.tar.gz" -C app/dist/data
          done
          # Maps for the latest release only (tags[0] is the release latest.json names below);
          # the app never reads an older release's maps. Releases before maps existed have no
          # maps asset; any other download failure stops the deploy.
          maps="maps-${tags[0]#data-}"
          if gh release view "${tags[0]}" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -qx "$maps.tar.gz"; then
            gh release download "${tags[0]}" --repo "$GITHUB_REPOSITORY" --dir /tmp/data \
              --pattern "$maps.tar.gz" --pattern "$maps.tar.gz.sha256"
            (cd /tmp/data && sha256sum -c "$maps.tar.gz.sha256")
            tar -xzf "/tmp/data/$maps.tar.gz" -C app/dist/data
          else
            echo "No maps asset for ${tags[0]}; deploying without maps."
          fi
          latest="${tags[0]#data-}"
          previous=$([ "${#tags[@]}" -gt 1 ] && echo "\"${tags[1]#data-}\"" || echo null)
          printf '{"release": "%s", "previous": %s}\n' "$latest" "$previous" > app/dist/data/latest.json
          cat app/dist/data/latest.json
      - name: Publish build checksums
        working-directory: app
        run: |
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS && wc -l dist/SHA256SUMS
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.163.0'
          workingDirectory: app
          command: >-
            pages deploy dist --project-name=within-reach
            --branch=${{ steps.target.outputs.branch }}
            --commit-hash=${{ github.sha }}
