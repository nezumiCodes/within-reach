# Within Reach pipeline settings (spec FR-02, FR-03, FR-04; decisions in docs/decisions.md).

[catchment]
radius_m = 5000         # every pharmacy within this straight-line distance...
max_candidates = 40     # ...capped at the nearest 40 in dense areas...
min_candidates = 5      # ...and always at least the nearest 5, however far
# If fewer than min_candidates of those can be reached on foot or by car (an estuary in the
# way), further pharmacies are added and routed, up to this straight-line distance and number
# of rounds, and the unreachable ones are dropped. See the walking rules and reachable
# pharmacies design (docs/superpowers/specs/2026-11-22-...).
reach_cap_m = 25000
reach_max_rounds = 4
# A walk is noted as "partly on a cycle path" when avoiding cycle paths not signed for walkers
# is impossible or adds more than this many metres.
cycle_note_min_extra_m = 50

[release]
max_file_bytes = 25_165_824   # 24 MiB: headroom under Cloudflare Pages' 25 MiB per-file limit
count_tolerance = 0.10        # counts per nation must be within ±10% of the previous release
# At most 2% of a nation's pharmacies may fail to geocode. Real lists run at about 1%
# (new or mistyped postcodes); a format change would push this far higher.
geocode_failure_limit = 0.02
# Online-only pharmacies excluded (471 matched in October 2026). Outside this range, the
# NHSBSA Contractor Details format has probably changed.
distance_selling_min = 200
distance_selling_max = 1000

[routing]
osrm_image = "ghcr.io/project-osrm/osrm-backend:v26.11.0-debian"

[maps]
# Area map files (Phase 2). Pinned by digest: the image only publishes a moving "master" tag.
# This is the build measured on 18 Nov 2026 (Birmingham 3.0 MB, Kent 8.7 MB, Highland 26.8 MB).
tilemaker_image = "ghcr.io/systemed/tilemaker@sha256:9cd8728a37a31c8a5205e091cedd3ff2c2c450c57e1ce3e5b58916185540ebba"
chunk_bytes = 20_971_520   # 20 MiB per map file; larger maps are split into byte chunks

[http]
user_agent = "within-reach-pipeline (+https://withinreach.vasnik.net)"
