[project]
name = "within-reach-pipeline"
version = "0.1.0"
description = "Builds Within Reach's public lookup bundles (postcodes, pharmacies, travel times) from open data."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
within-reach-pipeline = "within_reach_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
