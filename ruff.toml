# Shared Python lint settings for pipeline/ and scripts/.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]

[lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]

[lint.isort]
known-first-party = ["within_reach_pipeline"]
